<!DOCTYPE html>
<html lang="en">
<head>
<meta charset ="UTF-8">
<meta name="viewport" content="width+device-width,initial scale=1.0">
<title>Student Registration Form </title>
<style>
body{
    font-family: Arial,sans-serif;
    background:linear-gradient(to right,#74ebd5,#9face6);
    margin: 0;
    padding:30px;
}
.container{
    width: 600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius: 10px;
    box-shadow: 0 0 15px gray;

}
h2{
    text-align:centre;
    color:#003366;

}
table{
    width:100%;
}
td{
    padding: 10px;
}
input[type=text],
input[type=email],
input[type=password],
input[type=number],
input[type=data]
select,
textarea{
    width:100%;
    padding:8px;
    border:1px solid gray;
    border-radius:5px;
}
textarea{
    resize:none;
}
input[type=submit],
input[type=reset]{
    background: #003366;
    color:white;
    padding:10px 25px;
    border:none;
    border-radius: 5px;
    cursor:pointer;
}

input[type=submit]:hover,
input[type=reset]:hover{
    background:#0066cc;
}
.footer{
    text-align:center;
    margin-top:20px;
    color:gray;
}
</style>
</head>1

<h2>Student Registration Form</h2>
<form>
<table>
<tr>

<td><input type="text" placeholder="Enter your name"></td>
</tr>
